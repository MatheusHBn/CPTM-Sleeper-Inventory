spring:
  application:
    name: Gestao-de-Estoque-de-Dormentes

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cptm_stock}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
